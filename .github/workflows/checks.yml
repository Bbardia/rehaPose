name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 is where every native failure so far happened; Ubuntu proves Linux x64.
        os: [macos-14, ubuntu-24.04]  # pinned, so a runner image change is a commit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15   # a modal dialog offscreen hangs forever; fail instead
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rehapose
          key: rehapose-models-${{ matrix.os }}-${{ hashFiles('capture.py') }}
          restore-keys: rehapose-models-${{ matrix.os }}-
      - name: Linux system libraries for Qt, Qt Multimedia and OpenCV
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libpulse0 libpulse-mainloop-glib0
      - run: pip install -r requirements.txt ruff==0.16.8   # bump deliberately
      - run: ruff check .
      - run: python analysis.py
      - run: python test_rehapose.py
        env:
          QT_QPA_PLATFORM: offscreen
          REHAPOSE_ARTIFACTS: ${{ runner.temp }}/artifacts
      - run: python test_e2e.py
        env:
          QT_QPA_PLATFORM: offscreen
          REHAPOSE_ARTIFACTS: ${{ runner.temp }}/artifacts
      - if: failure()  # screenshots and session files of the failing run
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ matrix.os }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
          retention-days: 7
